<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grid Project</title>

<style>
    .nav {
        padding: 10px;
        display: flex;
        justify-content: center;
        gap: 30px;
        font-size: 20px;
        font-weight: bold;
        list-style: none;
        margin: 0;
        color: white;
        background-color: black;
    }

    .nav a {
        text-decoration: none;
        color: white;
    }
    .header {
        background: beige;
        font-size: 30px;
        font-weight: bolder;
        color: black;
        text-align: center;
        padding: 15px;
        margin-top: 10px;
    }
    img {
        display: block;
        width: 50vw;
        height: auto;
        margin: 10px auto;
    }
    .container {
        display: grid;
        background-color: rgb(175, 217, 250);
        height: auto;
        width: 100%;
        margin: 20px auto;
        border: 1px solid black;

        grid-template-columns: repeat(7, 1fr);
        grid-template-rows: repeat(6, 1fr);
    }

    .item {
        background-color: yellow;
        border: 1px solid black;
        width:100%;
        margin: 4px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-weight: bold;
        font-size: 20px;
    }

    .item1 { grid-column: 1 / -1; grid-row: 1 / 2;width: 100%; }
    .item2 { grid-column: 1 / 3; grid-row: 2 / 4;width: 100%; }
    .item3 { grid-column: 3 / 7; grid-row: 2 / 4;width: 100%; }
    .item4 { grid-column: 1 / 4; grid-row: 4 / 6; width: 100%;}
    .item5 { grid-column: 4 / 7; grid-row: 4 / 6; width: 100%;}

</style>
</head>

<body>

    <!-- NAV -->
    <ul class="nav">
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Location</a></li>
        <li><a href="#">Contact</a></li>
    </ul>

    <!-- HEADER -->
    <div class="header">Abes Engineering College</div>

    <!-- IMAGE -->
    <img src="https://www.abes.ac.in/assets/2.jpg" />

    <!-- GRID -->
    <div class="container">
        <div class="item item1">Fees<img src="feestructure for project.bmp"></div>
        <div class="item item2"><img src="https://upload.wikimedia.org/wikipedia/en/thumb/8/8d/National_Board_of_Accreditation.svg/1200px-National_Board_of_Accreditation.svg.png" ></div>
        <div class="item item3">Alumni<img src="allumni for project.bmp"><img src=""></div>
        <div class="item item4">Certification</div>
        <div class="item item5">Extra Info<p>Contact at abes@ac.in</p></div>
    </div>

</body>
</html>
